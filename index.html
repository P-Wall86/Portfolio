<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0A1128" />
  <title>W • A • L • L | built to serve</title>
  <meta name="description"
    content="WALL — desarrollo de software a medida. Web, arquitectura cloud y sistemas custom. Built to serve." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />

  <!-- Aplica el tema antes del paint para que no haya flash. Dark es el default. -->
  <script>
    try {
      if (localStorage.getItem('wall-theme') === 'light') {
        document.documentElement.classList.add('light')
      }
    } catch (error) {}
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
